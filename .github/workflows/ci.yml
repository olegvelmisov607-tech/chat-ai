name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    # --- НОВЫЙ ШАГ: Запуск Unit-тестов с покрытием ---
    # Запускаем ДО сборки, чтобы быстро узнать, есть ли ошибки в логике.
    # Если покрытие будет ниже порога (70%), этот шаг упадет, и пайплайн остановится.
    - name: Run Unit Tests with Coverage
      run: npm run test:coverage

    # --- НОВЫЙ ШАГ: Сохранение HTML-отчета покрытия ---
    # Даже если тесты прошли, мы хотим видеть отчет. 
    # В случае падения тестов (if: always()), отчет тоже сохранится, чтобы можно было проанализировать.
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always() 
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Build project
      run: npm run build

    - name: Run E2E Tests
      run: npx playwright test
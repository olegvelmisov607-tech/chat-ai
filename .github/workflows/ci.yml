name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Даем права на пуш изменений, чтобы экшен мог закоммитить бейдж в README
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    # --- Запуск Unit-тестов с покрытием ---
    - name: Run Unit Tests with Coverage
      run: npm run test:coverage

    # --- Генерация и коммит бейджа покрытия ---
    - name: Create Coverage Badge
      uses: H3nSte1n/coverage-badge-creator@v2
      with:
        format: istanbul # Vitest генерирует json-summary в совместимом формате
        commit: true     # Автоматически закоммитит изменения в README
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # --- Сохранение HTML-отчета покрытия как артефакта ---
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always() 
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Build project
      run: npm run build

    - name: Run E2E Tests
      run: npx playwright test
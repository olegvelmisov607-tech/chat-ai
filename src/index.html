<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local AI Chat</title>
  <meta name="theme-color" content="#2b5278">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="manifest" href="/manifest.json">
</head>
<body>

  <nav class="navbar">
    <div class="nav-links">
      <a href="#chat" class="nav-link">Чат</a>
      <a href="#settings" class="nav-link">Настройки</a>
    </div>
    
    <div class="controls-wrapper">
      <div class="model-selector-wrapper">
        <label for="model-select" style="color: white; margin-right: 5px;">Модель:</label>
        <select id="model-select">
          <option value="qwen">Qwen</option>
          <option value="deepseek-r1">DeepSeek (Reasoning)</option>
        </select>
      </div>

      <div class="temperature-wrapper">
        <label for="temperature-slider">Temp:</label>
        <input type="range" id="temperature-slider" min="0" max="1" step="0.1" value="0.7">
        <span id="temp-value">0.7</span>
      </div>

      <!-- ДОБАВЛЕНО: Кнопка PiP и чекбокс -->
      <button id="pip-btn" class="nav-btn" title="Вынести в отдельное окно">🪟</button>
      <label class="auto-pip-label" title="Автоматически открывать PiP при сворачивании вкладки">
        <input type="checkbox" id="auto-pip-toggle">
        Авто-PiP
      </label>
      <button id="notify-btn" class="nav-btn" title="Включить уведомления">🔔</button>
      <span id="budget-indicator" class="budget-indicator" title="Бюджет">☁️ 0/5</span>
    </div>
  </nav>

  <main id="app">
    <section id="screen-chat" class="screen active">
      <div id="chat-messages" class="messages-container"></div>
      
      <!-- Обертка для Drag-n-Drop -->
      <div id="drop-zone" class="chat-input-wrapper">
        <!-- Превью картинки -->
        <div id="image-preview-container" class="hidden">
          <img id="image-preview" src="" alt="Preview">
          <button type="button" id="remove-image-btn" title="Удалить">&times;</button>
        </div>

        <form id="chat-form" class="chat-input-area" style="padding: 8px 12px !important; display: flex; align-items: center; gap: 12px;">
          <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp, image/gif" class="hidden">
          
          <button type="button" id="attach-btn" title="Прикрепить картинку">📎</button>
          
          <input type="text" id="user-input" placeholder="Введите сообщение..." autocomplete="off" style="height: 52px !important; padding: 0 15px !important; font-size: 16px !important; flex: 1; border: none !important; border-radius: 6px; background-color: var(--bg-color); outline: none;">
          
          <button type="submit" id="send-btn" disabled>
            <span class="btn-text">Отправить</span>
            <span class="btn-icon" style="display: none;">➤</span>
          </button>
        </form>
      </div>
    </section>

    <section id="screen-settings" class="screen">
      <h1>Настройки PWA</h1>
      <p>Локальные модели управляются через <strong>Ollama</strong>.</p>
      <button id="install-btn" style="display: none;">Установить как приложение</button>
    </section>
  </main>

</body>
</html>
